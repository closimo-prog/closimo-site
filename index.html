<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOSIMO | Sales Expert</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bgPulse {
            0% { background-color: #050a14; }
            50% { background-color: #0f172a; }
            100% { background-color: #050a14; }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #050a14;
            animation: bgPulse 10s ease-in-out infinite;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            text-align: center; overflow: hidden;
        }

        .container { 
            padding: 40px; 
            max-width: 1000px;
            animation: reveal 1.5s ease-out forwards;
        }

        /* Large, Bold Brand Name */
        .brand-name {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 40px;
            color: #ffffff;
            text-transform: uppercase;
        }
        
        /* High-Authority Heading */
        h1 { 
            font-size: clamp(2rem, 8vw, 3.8rem); 
            font-weight: 900; 
            letter-spacing: -2px; 
            line-height: 1.1;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Slightly smaller secondary text as requested */
        .expert-title { 
            font-size: 1.1rem; 
            color: #FF6B35; /* Your Bold Orange */
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            margin-bottom: 60px;
        }

        .divider {
            width: 80px;
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin: 0 auto 40px;
        }

        .coming-soon {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 0.95rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-name">CLOSIMO</div>
        
        <h1>B2B SALES CONVERSION <br> OPTIMIZATION EXPERT</h1>
        <div class="expert-title">Building High-Ticket Systems</div>
        
        <div class="divider"></div>

        <div class="coming-soon">COMING SOON</div>
        <p class="tagline">Our digital home is being built for a premium experience.</p>
    </div>
</body>
</html>
