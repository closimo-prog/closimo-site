<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOSIMO | B2B Sales Expert</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; /* Deep Navy */
            color: #ffffff;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            text-align: center;
        }
        .container { padding: 40px; max-width: 900px; }
        .logo { width: 180px; margin-bottom: 50px; }
        
        h1 { 
            font-size: 3.5rem; 
            font-weight: 900; 
            letter-spacing: -1.5px; 
            line-height: 1.1;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .subhead { 
            font-size: 1.5rem; 
            color: #FF6B35; /* Bold Orange */
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            margin-bottom: 60px;
        }
        .status { 
            font-size: 1rem; 
            color: #64748b; 
            line-height: 1.6;
            border-top: 1px solid #334155;
            padding-top: 30px;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="CLOSIMO" class="logo">
        
        <h1>B2B SALES CONVERSION <br> OPTIMIZATION EXPERT</h1>
        <div class="subhead">Building High-Ticket Systems</div>
        
        <p class="status">Our digital home is under construction.<br>We are crafting a premium experience for you.</p>
    </div>
</body>
</html>
