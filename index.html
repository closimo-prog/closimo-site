<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOSIMO | Sales Expert</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Smooth Fade & Slide Entrance */
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* Luxury Spotlight Background Animation */
        @keyframes spotlight {
            0% { background: radial-gradient(circle at 50% 50%, #1e293b 0%, #050a14 100%); }
            50% { background: radial-gradient(circle at 50% 45%, #111827 0%, #050a14 100%); }
            100% { background: radial-gradient(circle at 50% 50%, #1e293b 0%, #050a14 100%); }
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #050a14;
            animation: spotlight 12s ease-in-out infinite;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            text-align: center; overflow: hidden;
        }

        .container { padding: 40px; max-width: 1000px; }

        /* Staggered Animation Timing */
        .brand-name, h1, .expert-title, .divider, .coming-soon, .tagline {
            opacity: 0;
            animation: revealUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .brand-name { 
            font-size: 3.5rem; font-weight: 900; letter-spacing: 6px; margin-bottom: 40px; 
            animation-delay: 0.2s; 
        }
        
        h1 { 
            font-size: clamp(2rem, 8vw, 3.8rem); font-weight: 900; letter-spacing: -2px; 
            line-height: 1.1; margin-bottom: 15px; text-transform: uppercase;
            animation-delay: 0.4s;
        }

        .expert-title { 
            font-size: 1.1rem; color: #FF6B35; font-weight: 600; text-transform: uppercase; 
            letter-spacing: 4px; margin-bottom: 60px;
            animation-delay: 0.6s;
        }

        .divider { 
            width: 80px; height: 1px; background: rgba(255,255,255,0.2); 
            margin: 0 auto 40px; animation-delay: 0.8s;
        }

        .coming-soon { 
            font-size: 1.3rem; font-weight: 800; letter-spacing: 3px; margin-bottom: 8px;
            animation-delay: 1s;
        }

        .tagline { 
            font-size: 0.95rem; color: #94a3b8; letter-spacing: 0.5px;
            animation-delay: 1.1s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-name">CLOSIMO</div>
        
        <h1>B2B SALES CONVERSION <br> OPTIMIZATION EXPERT</h1>
        <div class="expert-title">Building High-Ticket Systems</div>
        
        <div class="divider"></div>

        <div class="coming-soon">COMING SOON</div>
        <p class="tagline">Our digital home is being built for a premium experience.</p>
    </div>
</body>
</html>
