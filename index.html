<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOSIMO | Sales Expert</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bgPulse {
            0% { background-color: #050a14; }
            50% { background-color: #0f172a; }
            100% { background-color: #050a14; }
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #050a14;
            animation: bgPulse 10s ease-in-out infinite;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            text-align: center; overflow: hidden;
        }

        .container { 
            padding: 40px; 
            max-width: 1000px;
            animation: reveal 1.5s ease-out forwards;
        }

        /* This replaces your image logo */
        .text-logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 50px;
            color: #ffffff;
            display: inline-block;
            border-left: 5px solid #FF6B35; /* Brand Orange Accent */
            padding-left: 15px;
        }
        
        h1 { 
            font-size: clamp(2rem, 8vw, 3.8rem); 
            font-weight: 900; 
            letter-spacing: -2px; 
            line-height: 1.1;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .expert-title { 
            font-size: 1.2rem; 
            color: #FF6B35; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            margin-bottom: 60px;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin: 0 auto 40px;
        }

        .coming-soon {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-logo">CLOSIMO</div>
        
        <h1>B2B SALES CONVERSION <br> OPTIMIZATION EXPERT</h1>
        <div class="expert-title">Building High-Ticket Systems</div>
        
        <div class="divider"></div>

        <div class="coming-soon">COMING SOON</div>
        <p class="tagline">Our digital home is being built for a premium experience.</p>
    </div>
</body>
</html>
